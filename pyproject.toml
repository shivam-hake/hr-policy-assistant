[project]
name = "hr-policy-assistant"
version = "1.0.0"
description = "HR Policy Assistant: answers employee questions from HR policies with citations, and says when it doesn't know."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0",
    "langchain-groq>=1.0",
    "langchain-google-genai>=4.0",
    "langchain-text-splitters>=1.0",
    "langchain-chroma>=1.0",
    "fastembed>=0.5",
    "langchain-classic>=1.0",
    "rank-bm25>=0.2",
    "langgraph>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
